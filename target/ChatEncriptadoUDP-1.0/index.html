<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Chat Online</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="scripts.js"></script>
</head>

<body>

    <div class="chat-container">

        <!-- Zona de missatges -->
        <div id="chat-general" class="missatges-chat"></div>

        <!-- Barra inferior -->
        <div class="chat-input">
            <input type="text" id="missatge" placeholder="Escribe un mensaje...">
            <button id="btn-enviar">Enviar</button>
        </div>

        <!-- Modal de usuario -->
        <div id="username-modal" class="modal">
            <div class="modal-content">
                <h2>Benvingut al chat</h2>
                <p>Per favor, introdueix el teu nom:</p>
                <input type="text" id="nom-usuari" placeholder="Tu nombre">
                <button id="btn-entrar">Entrar</button>
            </div>
        </div>

    </div>

    <!-- PANELL USUARIS -->
    <div class="user-panel">
        <div class="user-panel-header">
            Usuaris
        </div>

        <div class="user-list">

            <label class="user-item">
                <input type="checkbox">
                <div class="avatar online">A</div>
                <span>Alex</span>
            </label>

        </div>
    </div>

</body>

</html>
